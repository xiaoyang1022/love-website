<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Her</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans SC",sans-serif;
    background:#000;
    color:white;
    overflow-x:hidden;
}


/* 导航栏 */

.nav{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    max-width:1000px;

    height:55px;

    display:flex;

    justify-content:space-around;

    align-items:center;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:30px;

    z-index:10;

}


.nav a{

    color:white;

    text-decoration:none;

    font-size:14px;

    opacity:.85;

    transition:.3s;

}


.nav a:hover{

    opacity:1;

}



/* 首页 */

.hero{

    height:100vh;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

}



/* 背景 */

.hero::before{

    content:"";

    position:absolute;

    inset:-10%;

    background:

    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600")

    center/cover;


    animation:zoom 18s infinite alternate;

}


@keyframes zoom{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.15);
    }

}



/* 黑色渐变 */

.hero::after{

    content:"";

    position:absolute;

    inset:0;

    background:

    linear-gradient(

    rgba(0,0,0,.35),

    rgba(0,0,0,.75)

    );

}



/* 内容 */

.content{

    position:relative;

    z-index:2;

    animation:fade 2s ease;

}


@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:none;

}

}



h1{

    font-size:

    clamp(50px,10vw,110px);

    letter-spacing:-3px;

    font-weight:700;

}



.subtitle{

    margin-top:25px;

    font-size:

    clamp(18px,3vw,28px);

    font-weight:300;

    opacity:.9;

}



/* 光环 */

.glow{

position:absolute;

width:300px;

height:300px;

background:white;

filter:blur(120px);

opacity:.15;

border-radius:50%;

}



/* 滚动 */

.scroll{

position:absolute;

bottom:50px;

left:50%;

transform:translateX(-50%);

font-size:30px;

animation:bounce 2s infinite;

z-index:3;

}



@keyframes bounce{

0%,100%{

transform:translate(-50%,0);

}

50%{

transform:translate(-50%,15px);

}

}



/* 手机 */

@media(max-width:600px){

.nav{

width:95%;

}

.nav a{

font-size:12px;

}

}

</style>


</head>


<body>


<nav class="nav">

<a href="#">Home</a>

<a href="#">Gallery</a>

<a href="#">Videos</a>

<a href="#">Letter</a>

<a href="#">About</a>

</nav>



<section class="hero">


<div class="glow"></div>


<div class="content">

<h1>For Her</h1>

<div class="subtitle">

有些人，只是出现，<br>
就足够惊艳整个青春。

</div>


</div>


<div class="scroll">

↓


</div>


</section>



</body>

  </html>
